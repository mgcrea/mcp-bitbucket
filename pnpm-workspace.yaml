allowBuilds:
  esbuild: true

# `min-release-age=1` in ~/.npmrc holds third-party publishes back for 24h. Our own
# scope is excluded there, but pnpm 11 reads this key rather than npm's
# `min-release-age-exclude`, so the exemption has to be repeated here. Scope-wide rather
# than pinned to one version, which would need re-adding on every release.
minimumReleaseAgeExclude:
  - "@mgcrea/*"
